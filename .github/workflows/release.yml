name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and manifest version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "$GITHUB_REF_NAME" = "$manifest_version"

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: |
          npm run lint -- --max-warnings=0
          npm run check:i18n
          npm test
          npm run build
          npm run package

      - name: Check packaged bundle and file set
        shell: bash
        run: |
          test "$(find build -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(find build -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "0"
          test -f build/main.js
          test -f build/manifest.json
          test -f build/styles.css
          ! grep -Eiq 'sql[.]js|node_modules/(fs|path)' build/main.js
          grep -Eq 'node:sqlite' build/main.js

      - name: Generate release attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            build/main.js
            build/manifest.json
            build/styles.css

      - name: Publish supported release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME//./_}"
          release_notes="docs/V${release_version}_RELEASE.md"
          test -f "$release_notes"
          gh release create "$GITHUB_REF_NAME" \
            build/main.js build/manifest.json build/styles.css \
            --notes-file "$release_notes" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
