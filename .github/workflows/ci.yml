name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Check localization
        run: npm run check:i18n

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Check packaged bundle and file set
        shell: bash
        run: |
          test "$(find build -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(find build -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "0"
          test -f build/main.js
          test -f build/manifest.json
          test -f build/styles.css
          ! grep -Eiq 'sql[.]js|node_modules/(fs|path)' build/main.js
          grep -Eq 'node:sqlite' build/main.js

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: academic-rss-reader-package
          path: |
            build/main.js
            build/manifest.json
            build/styles.css
          if-no-files-found: error
